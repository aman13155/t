<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login | YouTube Toxicity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .login-card {
      max-width: 420px; margin: 8vh auto; background: #fff; border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,.08); padding: 28px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h4 class="mb-3 text-center">Sign in</h4>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" type="text" class="form-control" placeholder="Enter Username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="Enter Password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('home') }}" class="small">Back to Home</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
