<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Comment Sentiment Analysis</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <link href="{{ url_for('static', filename='lib/animate/animate.min.css')}}"  rel="stylesheet">
    <link href="{{ url_for('static', filename='lib/owlcarousel/assets/owl.carousel.min.css')}}"  rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css')}}"  rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css')}}"  rel="stylesheet">
</head>
<body>

    
    <div class="container-xxl bg-white p-0">
        <div class="container-xxl py-5 bg-dark page-header mb-5">
            <div class="container my-5 pt-5 pb-4">
                <h1 class="display-3 text-white mb-3 animated slideInDown">Comment Sentiment Analysis</h1>
            </div>
        </div>

        <div class="container-xxl py-5">
            <div class="container mx-auto">
                <h1 class="text-center mb-5 wow fadeInUp" data-wow-delay="0.1s">Upload CSV File</h1>
                <div class="row g-4">
                    <div class="col-md-6 mx-auto">
                        <div class="wow fadeInUp" data-wow-delay="0.5s">
                            <form action="/upload/csv" method="post" enctype="multipart/form-data">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <input type="file" class="form-control" name="file" accept=".csv" required>
                                    </div>
                                    <div class="col-12">
                                        <button class="btn btn-primary w-100 py-3" type="submit">Upload and Analyze</button>
                                    </div>
                                </div>
                            </form>
                        </div>

                        {% if comments %}
                        <div class="mt-5">
                            <h2>Analysis Results</h2>
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>Comment</th>
                                        <th>Sentiment</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for comment, sentiment in comments %}
                                    <tr>
                                        <td>{{ comment }}</td>
                                        <td>{{ sentiment }}</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{url_for('static', filename='lib/wow/wow.min.js')}}"></script>
    <script src="{{url_for('static', filename='lib/easing/easing.min.js')}}"></script>
    <script src="{{url_for('static', filename='lib/waypoints/waypoints.min.js')}}"></script>
    <script src="{{url_for('static', filename='lib/owlcarousel/owl.carousel.min.js')}}"></script>
    <script src="{{url_for('static', filename='js/main.js')}}"></script>
</body>
</html>
